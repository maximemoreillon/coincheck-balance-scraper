apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APPLICATION_NAME}
spec:
  schedule: "15 16 * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ${APPLICATION_NAME}
              image: ${CONTAINER_IMAGE_TAGGED}
              env:
                - name: FINANCES_API_URL
                  value: http://finances
                - name: FINANCES_API_ACCOUNT_ID
                  value: "3"
              envFrom:
                - secretRef:
                    name: coincheck-scraper-env-from-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coincheck-scraper-env
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: coincheck-scraper-env-from-vault
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: coincheck-scraper
